<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">

<!-- Two classes on the root before the first paint.

     .js scopes the reveal rules, so a blocked or failed script leaves a readable
     page rather than an invisible one.

     data-theme applies a chosen theme before anything is drawn. Doing it here
     rather than at the end of the body is the difference between a page that
     opens dark and one that flashes white first. The stylesheet already answers
     to prefers-color-scheme on its own, so this runs only for somebody who has
     overruled their machine. -->
<script>
  (function () {
    var root = document.documentElement;
    root.classList.add('js');
    var match = document.cookie.match(/(?:^|;\s*)ppa-theme=(light|dark)/);
    if (match) root.setAttribute('data-theme', match[1]);
  })();
</script>

<link rel="stylesheet" href="{{asset.css}}">

<!-- After the site's own stylesheet, which declares the ramp this overrides. The server
     resolves both this and the marks below from whichever brand it is set to, so a restart
     changes the livery without rebuilding the site. -->
<link rel="stylesheet" href="/brand.css">
<link rel="icon" href="/brand/favicon">
<link rel="apple-touch-icon" href="/brand/favicon">

<!-- Brand neutral, because a browser reads this before any stylesheet loads. -->
<meta name="theme-color" content="#ffffff">
{{alternates}}
